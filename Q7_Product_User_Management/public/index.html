<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdminHub - Product & User Management CRUD (Q1)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header class="navbar">
      <div class="nav-container">
        <div class="brand">
          <span class="brand-icon">📦</span>
          <span class="brand-title">Admin<strong>Hub</strong></span>
        </div>
        <div class="tab-nav">
          <button class="tab-btn active" id="tab-products-btn" onclick="switchTab('products')">🛍️ Products Management</button>
          <button class="tab-btn" id="tab-users-btn" onclick="switchTab('users')">👥 Users Management</button>
        </div>
      </div>
    </header>

    <main class="content-container">
      <!-- TAB 1: PRODUCTS -->
      <section id="tab-products" class="tab-section active">
        <div class="grid-layout">
          <!-- Add Product Form -->
          <div class="card">
            <h3 class="card-title">Add New Product</h3>
            <div id="productValidationAlert" class="alert-box error" style="display: none;"></div>
            <form id="addProductForm" onsubmit="handleAddProduct(event)">
              <div class="form-group">
                <label>Product Name * (min 2 chars)</label>
                <input type="text" id="prodName" class="form-control" required placeholder="e.g. Wireless Gaming Mouse" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Price (₹) * (> 0)</label>
                  <input type="number" id="prodPrice" class="form-control" step="0.01" min="0.01" required placeholder="1499" />
                </div>
                <div class="form-group">
                  <label>Stock Units * (>= 0)</label>
                  <input type="number" id="prodStock" class="form-control" min="0" value="10" required />
                </div>
              </div>
              <div class="form-group">
                <label>Category *</label>
                <input type="text" id="prodCategory" class="form-control" required placeholder="e.g. Electronics" />
              </div>
              <div class="form-group">
                <label>Description</label>
                <textarea id="prodDesc" class="form-control" rows="2" placeholder="Product details..."></textarea>
              </div>
              <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">+ Save Product to MongoDB</button>
            </form>
          </div>

          <!-- Products Table -->
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <h3 class="card-title" style="margin-bottom: 0;">Products Directory</h3>
              <input type="text" id="searchProductInput" class="form-control" placeholder="Search product..." style="max-width: 200px;" oninput="onSearchProducts(this.value)" />
            </div>

            <div style="max-height: 480px; overflow-y: auto;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th style="text-align: right;">Actions</th>
                  </tr>
                </thead>
                <tbody id="productsTableBody">
                  <!-- Populated dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <!-- TAB 2: USERS -->
      <section id="tab-users" class="tab-section">
        <div class="grid-layout">
          <!-- Add User Form -->
          <div class="card">
            <h3 class="card-title">Register New User</h3>
            <div id="userValidationAlert" class="alert-box error" style="display: none;"></div>
            <form id="addUserForm" onsubmit="handleAddUser(event)">
              <div class="form-group">
                <label>Full Name * (min 2 chars)</label>
                <input type="text" id="userName" class="form-control" required placeholder="e.g. Aryan Chaurasia" />
              </div>
              <div class="form-group">
                <label>Email Address * (must be valid email)</label>
                <input type="email" id="userEmail" class="form-control" required placeholder="aryan@college.edu" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Phone Number (10 digits)</label>
                  <input type="tel" id="userPhone" class="form-control" placeholder="9876543210" maxlength="10" />
                </div>
                <div class="form-group">
                  <label>Role</label>
                  <select id="userRole" class="form-control">
                    <option value="Customer">Customer</option>
                    <option value="Manager">Manager</option>
                    <option value="Admin">Admin</option>
                  </select>
                </div>
              </div>
              <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">+ Create User Profile</button>
            </form>
          </div>

          <!-- Users Table -->
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <h3 class="card-title" style="margin-bottom: 0;">Registered Users</h3>
              <input type="text" id="searchUserInput" class="form-control" placeholder="Search user..." style="max-width: 200px;" oninput="onSearchUsers(this.value)" />
            </div>

            <div style="max-height: 480px; overflow-y: auto;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Contact</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th style="text-align: right;">Actions</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody">
                  <!-- Populated dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Edit Product Modal -->
    <div id="editProductModal" class="modal">
      <div class="modal-box">
        <h3 style="margin-bottom: 16px;">Edit Product</h3>
        <form id="editProductForm" onsubmit="handleUpdateProduct(event)">
          <input type="hidden" id="editProdId" />
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="editProdName" class="form-control" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Price (₹)</label>
              <input type="number" id="editProdPrice" class="form-control" step="0.01" required />
            </div>
            <div class="form-group">
              <label>Stock</label>
              <input type="number" id="editProdStock" class="form-control" required min="0" />
            </div>
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="editProdCategory" class="form-control" required />
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="editProdDesc" class="form-control" rows="2"></textarea>
          </div>
          <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px;">
            <button type="button" class="btn btn-secondary" onclick="closeEditProductModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Update Product</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Edit User Modal -->
    <div id="editUserModal" class="modal">
      <div class="modal-box">
        <h3 style="margin-bottom: 16px;">Edit User</h3>
        <form id="editUserForm" onsubmit="handleUpdateUser(event)">
          <input type="hidden" id="editUserId" />
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="editUserName" class="form-control" required />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="editUserEmail" class="form-control" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" id="editUserPhone" class="form-control" maxlength="10" />
            </div>
            <div class="form-group">
              <label>Role</label>
              <select id="editUserRole" class="form-control">
                <option value="Customer">Customer</option>
                <option value="Manager">Manager</option>
                <option value="Admin">Admin</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Account Status</label>
            <select id="editUserStatus" class="form-control">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
          <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px;">
            <button type="button" class="btn btn-secondary" onclick="closeEditUserModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Update User</button>
          </div>
        </form>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <footer class="footer">
      <p>OST Lab IA-2 (Question 1) | Stack: React UI + Express REST APIs + MongoDB Validation</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
